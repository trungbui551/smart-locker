# Cấu hình dùng riêng cho unit test và GitHub Actions CI (không cần bật Docker)
spring:
  datasource:
    url: jdbc:h2:mem:locker_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  mqtt:
    # Tắt kết nối mạng Mosquitto thật trong unit test CI; dùng giả lập trong MqttAndHeartbeatTests
    enabled: false
