server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-locker-backend
  # Tự động đọc file .env ở thư mục gốc repo (nếu có) để chạy local thuận tiện
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:locker}
    username: ${POSTGRES_USER:locker}
    password: ${POSTGRES_PASSWORD:locker}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Cấu hình ứng dụng lấy từ biến môi trường (.env)
app:
  seed-demo-users: ${APP_SEED_DEMO_USERS:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    topic-prefix: ${MQTT_TOPIC_PREFIX:}
  security:
    jwt-secret: ${JWT_SECRET:local-dev-only-jwt-secret-key-please-change-me-32chars}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
    otp-secret: ${OTP_SECRET:local-dev-only-otp-secret-key-please-change-me-32chars}
    reset-token-minutes: ${RESET_TOKEN_MINUTES:15}
  mail:
    # log | smtp | oauth2
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@smartlocker.local}}
    oauth2:
      client-id: ${GMAIL_OAUTH_CLIENT_ID:}
      client-secret: ${GMAIL_OAUTH_CLIENT_SECRET:}
      refresh-token: ${GMAIL_OAUTH_REFRESH_TOKEN:}
  otp:
    expiration-hours: ${OTP_EXPIRATION_HOURS:24}
    max-failed-attempts: ${OTP_MAX_FAILED_ATTEMPTS:3}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:twilio}
    api-key: ${SMS_API_KEY:}
    api-secret: ${SMS_API_SECRET:}
    from: ${SMS_FROM:}

# Mở cổng kiểm tra sức khỏe /actuator/health
management:
  health:
    # Không để trạng thái SMTP làm báo DOWN khi dùng MAIL_MODE=log hoặc oauth2
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
